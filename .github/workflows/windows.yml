# Build the Windows plugin and package it with the Qt WebEngine runtime Kate for Windows does not
# ship. Kate's own build is Craft-made (MSVC 2022, Qt 6.11.1, KF 6.28.0), so this uses the same
# Craft binary cache to get an ABI-identical plugin; nothing compiles from source except src/*.cpp.
#
# Why this is not on every push: one run pulls a couple of GB of prebuilt Qt and Chromium from
# files.kde.org. It runs on tags (to attach the release artifact), on changes to the build inputs,
# and on demand.
#
# Keep --ci-mode: without it a hash mismatch on a mirror-served archive drops Craft into an
# interactive prompt that dies with EOFError on a runner.
#
# actions/checkout is SHA-pinned because the tag path runs with a write-scoped GITHUB_TOKEN.

name: windows

on:
  # No paths filter on the tag trigger. GitHub ANDs branches/tags with paths, so a release tag on a
  # commit that does not touch src/ would skip this job and publish a release with no Windows
  # artifact and no error.
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'src/**'
      - 'data/**'
      - 'CMakeLists.txt'
      - 'packaging/windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Every Craft step re-enters the MSVC environment: each `run:` is its own shell, and Craft's
  # source builds fail in confusing ways without it.
  VSDEVSH: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Launch-VsDevShell.ps1

defaults:
  run:
    shell: pwsh

jobs:
  build:
    # windows-latest now points at Windows Server 2025 with Visual Studio 2026, where Craft's
    # bundled vswhere finds no Visual Studio and the bootstrap aborts. Kate's own Windows build,
    # Craft's binary cache, and Craft's default ABI target msvc2022 too; Craft's source still calls
    # msvc2026 untested.
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write  # only used by the release-upload step, which is tag-gated

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # Craft's own failure for a missing toolchain is "Unable to locate Visual Studio", buried in a
      # bootstrap log, and it aborts three steps later with something unrelated. Check it here so a
      # runner-image change says so in one line.
      - name: verify the runner has the msvc2022 toolset
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "no vswhere at $vswhere" }
          $path = & $vswhere -property installationPath -nologo -latest -products '*' `
            -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          if (-not $path) {
            throw 'no Visual Studio 2022 with the C++ toolset on this runner. windows-latest moved to VS 2026; this job needs the msvc2022 image.'
          }
          Write-Host "VS 2022 at $path"

      # Craft warns about every foreign toolchain it finds, then fails much later and somewhere
      # else: its msys bash ran the runner's C:\mingw64\bin\make.exe and the pkgconf build died on
      # the mixed toolchain. Dropping them from PATH is not enough, since Craft's msys environment
      # finds them by absolute path anyway, so the directories go.
      - name: remove foreign toolchains
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Path 'C:\mingw64' -Recurse -Force -ErrorAction Ignore
          Remove-Item -Path 'C:\Strawberry' -Recurse -Force -ErrorAction Ignore
          Remove-Item -Path 'C:\Program Files\Git\bin\sh.exe' -Force -ErrorAction Ignore
          git config --global core.autocrlf false

      - name: bootstrap craft
        run: |
          $ErrorActionPreference = 'Stop'
          # Craft source-builds its whole base stack (pkgconf, icu, gettext, python) during the
          # bootstrap, and those builds need a live MSVC environment. Without it gettext fails to
          # link against iconv after about an hour of work.
          & $env:VSDEVSH -SkipAutomaticLocation -Arch amd64 -HostArch amd64
          $env:ANDROID_SDK_ROOT = $null
          python -m pip install --upgrade certifi
          $installer = Join-Path $env:RUNNER_TEMP 'install_craft.ps1'
          Invoke-WebRequest -Uri 'https://invent.kde.org/packaging/craft/-/raw/master/setup/install_craft.ps1' -OutFile $installer
          Unblock-File -Path $installer
          # -use-defaults picks msvc2022 + x86_64 with no prompts. It is a param() script, so it has
          # to be invoked as a file; piping it to iex cannot pass arguments.
          & $installer -use-defaults -root C:\CraftRoot
          if (-not (Test-Path 'C:\CraftRoot\craft\craftenv.ps1')) {
            throw 'craft bootstrap produced no craftenv.ps1'
          }
          # craftenv.ps1 opens with `cls`, which throws in a non-console host and takes the whole
          # step with it.
          Unblock-File -Path C:\CraftRoot\craft\craftenv.ps1
          (Get-Content C:\CraftRoot\craft\craftenv.ps1) -replace '^cls$', '' | Set-Content C:\CraftRoot\craft\craftenv.ps1

      - name: verify craft abi
        run: |
          $ErrorActionPreference = 'Stop'
          # The plugin has to match Kate's own ABI or it never loads: read the ABI the bootstrap
          # wrote and fail the run on another one.
          $abi = (Select-String -Path C:\CraftRoot\etc\CraftSettings.ini -Pattern '^\s*ABI\s*=\s*(\S+)').Matches.Groups[1].Value
          Write-Host "craft ABI: $abi"
          if ($abi -ne 'windows-cl-msvc2022-x86_64') {
            throw "craft ABI is '$abi', expected windows-cl-msvc2022-x86_64"
          }

      - name: install dependencies from cache
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:VSDEVSH -SkipAutomaticLocation -Arch amd64 -HostArch amd64
          $env:ANDROID_SDK_ROOT = $null
          . C:\CraftRoot\craft\craftenv.ps1
          # craftenv.ps1 leaves the shell in C:\CraftRoot, where relative paths would resolve.
          Set-Location $env:GITHUB_WORKSPACE
          # 'qtwebengine' alone is ambiguous, Craft carries a Qt5 and a Qt6 blueprint under that
          # name. Craft's own downloader has been seen hanging on large mirror-served archives, so
          # give it a couple of attempts before calling the run bad.
          $ok = $false
          foreach ($attempt in 1..3) {
            Write-Host "craft attempt $attempt"
            craft --ci-mode --use-cache ktexteditor libs/qt6/qtwebengine
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Warning "craft exited $LASTEXITCODE, retrying"
          }
          if (-not $ok) { throw 'craft failed to install dependencies' }
          foreach ($dll in @('C:\CraftRoot\bin\KF6TextEditor.dll', 'C:\CraftRoot\bin\Qt6WebEngineCore.dll')) {
            if (-not (Test-Path $dll)) { throw "missing after install: $dll" }
          }

      - name: build
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:VSDEVSH -SkipAutomaticLocation -Arch amd64 -HostArch amd64
          $env:ANDROID_SDK_ROOT = $null
          . C:\CraftRoot\craft\craftenv.ps1
          # craftenv.ps1 leaves the shell in C:\CraftRoot, where relative paths would resolve.
          Set-Location $env:GITHUB_WORKSPACE
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH=C:/CraftRoot -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'cmake configure failed' }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

      - name: package
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:VSDEVSH -SkipAutomaticLocation -Arch amd64 -HostArch amd64
          $env:ANDROID_SDK_ROOT = $null
          . C:\CraftRoot\craft\craftenv.ps1
          # craftenv.ps1 leaves the shell in C:\CraftRoot, where relative paths would resolve.
          Set-Location $env:GITHUB_WORKSPACE
          $match = Select-String -Path CMakeLists.txt -Pattern '^project\(.*VERSION\s+([0-9.]+)'
          if (-not $match) { throw 'could not read the project version out of CMakeLists.txt' }
          $version = $match.Matches[0].Groups[1].Value
          .\packaging\windows\make-payload.ps1 `
            -CraftRoot C:\CraftRoot `
            -PluginDll build\bin\kf6\ktexteditor\katemark.dll `
            -LocaleDir build\locale `
            -OutDir dist `
            -Zip "dist\katemark-$version-windows-x86_64.zip"
          Get-ChildItem dist\*.zip | ForEach-Object { "{0}  {1:N0} bytes" -f $_.Name, $_.Length }

      # Test the zip in a real Kate install, with a render: Craft's tree has files the payload may
      # lack. The payload once shipped without v8_context_snapshot.bin, and every check against
      # Craft's tree passed.
      - name: verify the artifact against a real Kate
        run: |
          $ErrorActionPreference = 'Stop'
          # Look up the release series and the build: KDE's CI drops old builds, so a pinned URL
          # 404s within weeks, and the series changes twice a year. Testing the newest Kate also
          # tells when Kate moves to a Qt the payload no longer matches.
          $root = 'https://cdn.kde.org/ci-builds/utilities/kate/'
          $series = [regex]::Matches((Invoke-WebRequest -Uri $root -UseBasicParsing).Content, 'href="(release-[0-9.]+)/"') |
            ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          if (-not $series) { throw "no release-* series found at $root" }
          # The newest series dir usually appears before its Windows CI builds land on the CDN, so
          # walk back to the newest series that has a windows/ listing. That is still the newest
          # Kate the payload can be tested against.
          $dir = $null
          for ($i = $series.Count - 1; $i -ge 0; $i--) {
            $candidate = $root + $series[$i] + '/windows/'
            try {
              $null = Invoke-WebRequest -Uri $candidate -UseBasicParsing -ErrorAction Stop
              $dir = $candidate
              Write-Host "series: $($series[$i])"
              break
            } catch {
              Write-Host "series $($series[$i]) has no windows builds yet"
            }
          }
          if (-not $dir) { throw "no release-* series with windows builds found at $root" }
          $page = Invoke-WebRequest -Uri $dir -UseBasicParsing
          $names = [regex]::Matches($page.Content, 'kate-release_[0-9.]+-(\d+)-windows-cl-msvc2022-x86_64\.exe') |
            ForEach-Object { [pscustomobject]@{ name = $_.Value; build = [int]$_.Groups[1].Value } } |
            Sort-Object build -Descending
          if (-not $names) { throw "no Kate installer found at $dir" }
          $installer = Join-Path $env:RUNNER_TEMP $names[0].name
          Write-Host "using $($names[0].name)"
          Invoke-WebRequest -Uri ($dir + $names[0].name) -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          $kate = 'C:\Program Files\Kate'
          if (-not (Test-Path "$kate\bin\kate.exe")) { throw "Kate did not install to $kate" }
          Write-Host ("Kate's Qt: " + (Get-Item "$kate\bin\Qt6Core.dll").VersionInfo.FileVersion)

          # install.ps1 throws on failure rather than setting an exit code, and
          # $ErrorActionPreference is Stop, so a failure fails the step on its own. Do not add a
          # $LASTEXITCODE check here: it still holds the last NATIVE command's code and would
          # report a stale failure.
          & .\dist\install.ps1 -KateDir $kate

          # Our catalog has to sit next to Kate's own, or KI18n never finds it and the plugin
          # stays in English.
          foreach ($mo in @('kate.mo', 'katemark.mo')) {
            $path = "$kate\bin\data\locale\fr\LC_MESSAGES\$mo"
            if (-not (Test-Path $path)) { throw "missing $path" }
          }

          Copy-Item build\bin\previewlifecycletest.exe "$kate\bin\" -Force
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QTWEBENGINE_CHROMIUM_FLAGS = '--disable-gpu --no-sandbox'
          # Resolve everything from Kate's directory, so CraftRoot cannot quietly backstop a file
          # the payload is missing.
          $env:PATH = "$kate\bin;$env:SystemRoot\system32;$env:SystemRoot"
          Push-Location "$kate\bin"
          try {
            $proc = Start-Process -FilePath "$kate\bin\previewlifecycletest.exe" -NoNewWindow -Wait -PassThru
            $code = $proc.ExitCode
          } finally {
            Pop-Location
          }
          # Chromium writes its fatal diagnostics here rather than to stdout, so print it before
          # deciding anything: an empty debug.log is part of the pass evidence.
          if (Test-Path "$kate\bin\debug.log") {
            Write-Host '--- debug.log ---'
            Get-Content "$kate\bin\debug.log"
          }
          if ($code -ne 0) { throw "previewlifecycletest exited $code against the packaged install" }
          Write-Host 'render test passed against the packaged Kate install'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: katemark-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          # release.yml creates the release on the same tag push, so this can win the race. Wait for
          # it rather than creating a second, competing release.
          $found = $false
          foreach ($attempt in 1..20) {
            gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { $found = $true; break }
            Start-Sleep -Seconds 15
          }
          if (-not $found) { throw "release $tag never appeared; is release.yml failing?" }
          gh release upload $tag (Get-ChildItem dist\*.zip).FullName --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'upload failed' }
