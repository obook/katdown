# Create a GitHub release on every v* tag. The update check (Settings -> Katemark) compares
# the installed version with the latest release tag. windows.yml and deb.yml run on the same
# tag and attach the Windows zip and the Debian packages.
#
# The tag must match project(VERSION) in CMakeLists.txt and Version in src/katemark.json, or
# the update check reports an update that does not exist. The job fails on a mismatch.
#
# actions/checkout is SHA-pinned because this workflow runs with a write-scoped GITHUB_TOKEN.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: verify tag matches project version
        run: |
          set -Eeuo pipefail
          proj=$(grep -oP '^project\([^)]*VERSION\s+\K[0-9.]+' CMakeLists.txt)
          if [ "v$proj" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match CMake project version v$proj"
            exit 1
          fi

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists; nothing to do"
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag"
