# Build the plugin on Linux and run the tests on every push and PR. Without this, a commit
# that breaks the Arch build reaches katemark-git users first.
#
# Arch in a container: it has the rolling Qt6/KF6 the AUR package builds against, which
# Ubuntu's packages trail. `pacman -Syu` picks those versions; the image digest only fixes
# the starting point.
#
# The preview is a QWebEngineView, so the tests drive a headless Chromium as root. The offscreen
# platform and --no-sandbox come from the tests' own ENVIRONMENT property in tests/CMakeLists.txt,
# so there is nothing to set here. The default 64 MB /dev/shm a container gets is enough for it
# (verified 2026-08-09: passes with and without a larger --shm-size).

name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'assets/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'assets/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:base-devel@sha256:6db772fd1dd128b9cf7b7231ca5284af70879596fe4ec754c911cfc4ac30d5eb

    steps:
      # Mirrors aur/PKGBUILD's depends + makedepends, plus ninja for the generator this uses,
      # git for the checkout below (base-devel carries the compiler, not git) and poppler, whose
      # pdftotext reads the exported PDF back in one test.
      - name: install dependencies
        run: |
          set -Eeuo pipefail
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git cmake ninja extra-cmake-modules poppler \
            ktexteditor syntax-highlighting kxmlgui kwidgetsaddons kconfig ki18n kcoreaddons qt6-base qt6-webengine

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: configure
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON

      - name: build
        run: cmake --build build

      # --no-tests=error because a bare ctest exits 0 when it finds nothing to run, so a change
      # that stopped BUILD_TESTING from registering the tests would leave this step green.
      - name: test
        run: ctest --test-dir build --output-on-failure --no-tests=error
