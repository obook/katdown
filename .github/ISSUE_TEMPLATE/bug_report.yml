name: Bug report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's the bug?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: How to reproduce it.
      placeholder: |
        1. ...
        2. ...
        3. see error
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Kate's version is under Help, then About Kate.
      value: |
        katemark version:
        Kate version:
        OS:
        installation method (.deb / AUR / openSUSE rpm / Windows zip / built from source):
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant error output. Rendered as code, no backticks needed.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Notes
      description: Anything else worth knowing.
    validations:
      required: false

  - type: dropdown
    id: ai
    attributes:
      label: AI
      description: "Using AI is fine: say how much you used it."
      options:
        - no AI
        - AI-assisted, I reviewed everything
        - AI did most of it under my direction
    validations:
      required: true
